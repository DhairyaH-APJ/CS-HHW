<!DOCTYPE html>
<html>
<html lang = "en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CS Project</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
<div id="titlee"><h1>Todo List</h1></div>
<div id = "todolist"> <ul> 
	{% for todo in todos %}
		<li>
			<input type = "checkbox" name="done" {% if todo['done'] %} checked {%endif%} disabled onchange = "this.form.submit()" </input> 

			<span {%if todo['done'] %} style="text-decoration: line-through;" {%endif%}> {{ todo['task']}} </span>

			<a href = "{{url_for('edit', index = loop.index0)}}"> Edit</a>
			<a href = "{{url_for('delete', index = loop.index0)}}"> Delete</a>
			<a href = "{{url_for('check', index = loop.index0)}}"> Check</a>
		</li>
	{% endfor %}
</ul>
<div id="form"> 	<form action="{{ url_for('add')}}" method ="post">	
		<input type="text" name="todo">
		<button type="submit" id ="submitbutton"> Add todo </button>
	</form>
</div>
</div>
</body>
</html>
